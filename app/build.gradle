plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.echoreading'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.echoreading"
        minSdk 33
        targetSdk 35
        versionCode 4
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-session:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def debugApk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')

tasks.register('verifySherpaPackaging') {
    dependsOn tasks.named('assembleDebug')
    inputs.file(debugApk)
    doLast {
        def apk = debugApk.get().asFile
        if (!apk.isFile()) throw new GradleException("Debug APK was not generated")
        def zip = new java.util.zip.ZipFile(apk)
        try {
            ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
                if (zip.getEntry("lib/$abi/libsherpa-onnx-jni.so") == null) {
                    throw new GradleException("Missing Sherpa JNI library for $abi")
                }
                if (zip.getEntry("lib/$abi/libonnxruntime.so") == null) {
                    throw new GradleException("Missing ONNX Runtime library for $abi")
                }
            }
        } finally {
            zip.close()
        }
    }
}
